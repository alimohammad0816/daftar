# نصب: این فایل را در سرور به /etc/nginx/sites-available/notes.angoti.ir
# کپی کن، لینک بزن به sites-enabled، و گواهی را با certbot بگیر:
#
#   sudo cp nginx/notes.angoti.ir.conf /etc/nginx/sites-available/notes.angoti.ir
#   sudo ln -s /etc/nginx/sites-available/notes.angoti.ir /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d notes.angoti.ir
#
# پیش‌نیاز: کانتینر با docker-compose.yml این پروژه بالا باشد (پورت‌های
# سمت هاست پایین، در بخش «شبکه» docker-compose.yml، رندوم انتخاب شده‌اند نه
# ۳۰۰۰/۸۰۰۰ پیش‌فرض). این nginx روی خودِ هاست اجرا می‌شود، نه داخل کانتینر —
# چیدمانی که بند ۱۶.۲ در PLAN.md پیشنهاد داده بود.
#
# هر دو سرویس زیر یک دامنه‌اند تا مرورگر آن‌ها را cross-origin نبیند — بدون
# CORS، بدون third-party cookie. مسیرهای FastAPI (auth/sync/blobs/health)
# با مسیرهای صفحات Next.js (/, /day, /notes, /tasks, /settings, /_next) هیچ
# تداخلی ندارند، پس فقط بر اساس prefix مسیر روت می‌شوند، بدون rewrite.
#
# اگر پورت‌های سمت هاست را در docker-compose.yml عوض کردی، فقط همین دو خط را
# به‌روز کن — همه‌جای پایین از همین دو upstream استفاده می‌کنند.
upstream daftar_web {
    server 127.0.0.1:61997;
}
upstream daftar_api {
    server 127.0.0.1:53554;
}

server {
    listen 80;
    listen [::]:80;
    server_name notes.angoti.ir;

    # certbot --nginx خودش این بلوک را هنگام صدور گواهی اضافه/استفاده می‌کند
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # syntax قدیمی‌تر (به‌جای «http2 on;» جدا) عمداً است — روی nginx زیر
    # ۱.۲۵.۱ (که «http2 on;» را اصلاً نمی‌شناسد) هم کار می‌کند.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notes.angoti.ir;

    # certbot --nginx این دو خط را خودش پر می‌کند؛ اگر دستی گرفتی، مسیر را
    # اینجا بگذار.
    ssl_certificate     /etc/letsencrypt/live/notes.angoti.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.angoti.ir/privkey.pem;

    # بند ۱۴.۳ PLAN.md: HTTPS اجباری — این هدر مرورگر را وادار می‌کند حتی
    # درخواست بعدی را هم مستقیم https بفرستد.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25m;  # سقف ضمیمه، هم‌راستا با MAX_BLOB_SIZE در api/app/config.py

    # --- FastAPI ---
    location /auth/ {
        proxy_pass http://daftar_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /blobs/ {
        proxy_pass http://daftar_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://daftar_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # رلهٔ WebSocket (بند ۱۳.۵/۱۶.۱) — باید هدرهای Upgrade صریح رد شوند و
    # timeout بلند بماند، وگرنه nginx بعد از چند دقیقه بی‌کاری قطعش می‌کند
    # در حالی که تب کاربر هنوز باز است.
    location /sync/ {
        proxy_pass http://daftar_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Next.js: هر مسیر دیگری، شامل صفحات و _next/static ---
    location / {
        proxy_pass http://daftar_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
