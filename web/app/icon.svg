<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="دفتر">
  <!-- پالت بند ۱۰ PLAN.md: لاجوردی #1B6EC4 و فیروزه‌ای #0D9488.
       دفترچهٔ شیرازه‌دار: شیرازه سمت راست است، چون جلد در RTL از راست باز می‌شود. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#1B6EC4"/>
    </linearGradient>
    <clipPath id="page">
      <rect x="22" y="20" width="56" height="60" rx="8"/>
    </clipPath>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#tile)"/>
  <rect x="22" y="20" width="56" height="60" rx="8" fill="#FFFFFF"/>
  <rect x="64" y="20" width="14" height="60" fill="#0D9488" clip-path="url(#page)"/>
</svg>
